[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "redirect-ledger"
version = "0.1.0"
description = "Audit exact-path redirect maps before a site migration."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "KanadeK"}]
dependencies = []
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
]

[project.scripts]
redirect-ledger = "redirect_ledger.cli:main"

[project.urls]
Repository = "https://github.com/KanadeK/redirect-ledger"
Issues = "https://github.com/KanadeK/redirect-ledger/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S311", "S603", "S607"]

[tool.coverage.run]
branch = true
source = ["redirect_ledger"]

[tool.coverage.report]
show_missing = true
fail_under = 85
